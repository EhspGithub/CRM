            <!-- ================= 3. CLIENT MANAGEMENT TAB ================= -->
            <section id="tab-patients-list" class="hidden space-y-6 no-print">
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 space-y-4">

                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 mb-1.5">ماده مصرفی:</label>
                            <select id="search-m-substance" onchange="filterDirectory()" class="w-full px-4 py-2 border border-gray-300 rounded-xl text-xs outline-none focus:border-teal-brand">

                                <option value="تریاک">تریاک</option>
                                <option value="شیره">شیره</option>
                                <option value="هروئین">هروئین</option>
                                <option value="کراک">کراک</option>
                                <option value="شیشه (مت‌آمفتامین)">شیشه (مت‌آمفتامین)</option>
                                <option value="ترامادول">ترامادول</option>
                                <option value="ماریجوانا / گل">ماریجوانا / گل</option>
                                <option value="الکل">الکل</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 mb-1.5">داروی تجویزی فعلی:</label>
                            <select id="search-m-drug" onchange="filterDirectory()" class="w-full px-4 py-2 border border-gray-300 rounded-xl text-xs outline-none focus:border-teal-brand">
                                <option value="">همه موارد</option>
                                <option value="روان درمانی">روان درمانی</option>
                                <option value="ش متادون">ش متادون</option>
                                <option value="ق متادون">ق متادون</option>
                                <option value="بوپرنورفین">بوپرنورفین</option>
                                <option value="اپیوم">اپیوم</option>
                                <option value="متقاضی اپیوم">متقاضی اپیوم</option>
                                <option value="داروی نامعلوم">داروی نامعلوم / سایر</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 mb-1.5">نوع حضور:</label>
                            <select id="search-m-status" onchange="filterDirectory()" class="w-full px-4 py-2 border border-gray-300 rounded-xl text-xs outline-none focus:border-teal-brand">
                                <option value="">همه پرونده‌ها</option>
                                <option value="فعال">فعال</option>
                                <option value="غیرفعال">غیرفعال</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 mb-1.5">محل پرونده:</label>
                            <select id="search-m-filestatus" onchange="filterDirectory()" class="w-full px-4 py-2 border border-gray-300 rounded-xl text-xs outline-none focus:border-teal-brand">
                                <option value="">همه موارد</option>
                                <option value="فعال">فعال</option>
                                <option value="بایگانی">بایگانی</option>
                                <option value="حذف پرونده">حذف پرونده</option>
                                <option value="معلق">معلق</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="px-6 py-4 border-b border-gray-100 bg-slate-50/50 flex justify-between items-center flex-wrap gap-2">
                <h3 class="text-sm font-extrabold text-slate-800">بانک مراجعین کلینیک نسیم رهایی</h3>
                <span id="badge-total-m" class="px-3 py-1 bg-teal-brand/10 text-teal-brand text-xs font-bold rounded-full">کل: ۰ بیمار</span>

            <div class="overflow-x-auto custom-scrollbar">
                <table class="w-full text-right border-collapse font-sans">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 text-xs font-bold border-b border-gray-200">
                            <th class="p-4">کد پرونده</th>
                            <th class="p-4">مشخصات</th>
                            <th class="p-4">کد ملی</th>
                            <th class="p-4">درمان اولیه</th>
                                    <th class="p-4">درمان فعلی</th>
                                    <th class="p-4 text-center">نوع حضور</th>
                                    <th class="p-4 text-center">محل پرونده</th>
                                    <th class="p-4 text-center">ثبت سامانه</th>

                                    <th class="p-4 text-center">اقدامات</th>

                            </tbody>
                        </table>
                    </div>
                    <!-- بخش کنترل صفحه‌بندی جدول مراجعین -->
                    <div id="patients-pagination-ui" class="px-6 py-4 border-t border-gray-100 bg-slate-50/50 flex justify-between items-center text-xs transition-all"></div>
                </div>
            </section>
