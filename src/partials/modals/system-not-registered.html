    <!-- System Non-Registration Reason Modal -->
    <div id="system-not-registered-modal" class="hidden fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50 animate-fade-in no-print">
        <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full overflow-hidden border border-slate-100">
            <div class="bg-amber-500 p-5 text-white flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-circle-exclamation text-lg"></i>
                    <h3 class="text-sm font-bold">علت عدم ثبت در سامانه</h3>
                </div>
                <button onclick="closeSystemNotRegisteredModal()" class="text-white/80 hover:text-white">
                    <i class="fa-solid fa-circle-xmark text-lg"></i>
                </button>
            </div>
            <form id="system-not-registered-form" onsubmit="handleSystemNotRegisteredSubmit(event)" class="p-6 space-y-4 text-xs">
                <input type="hidden" id="sysnotreg-patient-id">
                <div>
                    <label class="block font-bold text-slate-700 mb-2">نام و مشخصات بیمار:</label>
                    <div id="sysnotreg-patient-details" class="p-3 bg-slate-50 border rounded-xl font-bold">---</div>
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-2">علت عدم ثبت در سامانه <span class="text-red-500">*</span></label>
                    <select id="sysnotreg-reason" required onchange="toggleSysNotRegOtherCenterField()" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl outline-none focus:border-teal-brand">
                        <option value="" disabled selected>لطفاً علت را انتخاب کنید</option>
                        <option value="فعلاً ثبت نشده">فعلاً ثبت نشده</option>
                        <option value="ثبت در مرکز دیگر">ثبت در مرکز دیگر</option>
                        <option value="عدم تمایل به ثبت">عدم تمایل به ثبت</option>
                        <option value="شماره موبایل به اسم فرد نیست">شماره موبایل به اسم فرد نیست</option>
                    </select>
                </div>
                <div id="sysnotreg-othercenter-container" class="hidden">
                    <label class="block font-bold text-slate-700 mb-2">نام مرکز دیگر <span class="text-red-500">*</span></label>
                    <input type="text" id="sysnotreg-othercenter" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl outline-none focus:border-teal-brand" placeholder="نام مرکز درمانی محل ثبت مراجع...">
                </div>
                <div class="pt-4 border-t flex justify-end gap-2">
                    <button type="button" onclick="closeSystemNotRegisteredModal()" class="px-4 py-2 border rounded-xl hover:bg-slate-50">انصراف</button>
                    <button type="submit" id="sysnotreg-submit-btn" class="px-5 py-2 bg-amber-500 hover:bg-amber-600 text-white rounded-xl font-bold transition disabled:opacity-50 disabled:cursor-not-allowed">ذخیره</button>
                </div>
            </form>
        </div>
    </div>
