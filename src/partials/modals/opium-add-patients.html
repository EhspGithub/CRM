    <!-- ================= OPIUM: ADD PATIENTS MODAL ================= -->
    <div id="opium-add-modal" class="hidden fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50 no-print">
        <div class="bg-white rounded-3xl shadow-2xl max-w-2xl w-full overflow-hidden border border-slate-100 max-h-[92vh] flex flex-col animate-fade-in">
            <div class="shrink-0 bg-teal-700 p-5 text-white flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-user-plus text-lg"></i>
                    <h3 class="text-sm font-bold">افزودن بیمار به فهرست مدیریت اپیوم</h3>
                </div>
                <button onclick="closeOpiumAddModal()" class="text-white/80 hover:text-white"><i class="fa-solid fa-circle-xmark text-lg"></i></button>
            </div>
            <div class="shrink-0 p-4 border-b space-y-2">
                <input type="text" id="opium-add-search" oninput="renderOpiumAddResults()" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-xs outline-none focus:border-teal-brand" placeholder="جست‌وجو بر اساس نام و نام خانوادگی، کد پرونده یا کد ملی...">
                <div class="flex justify-between items-center text-[11px] font-bold text-slate-500">
                    <span id="opium-add-hint"></span>
                    <label class="inline-flex items-center gap-2 cursor-pointer"><input type="checkbox" id="opium-add-all" onchange="opAddToggleAll(this.checked)" class="rounded text-teal-brand w-4 h-4"> انتخاب همه نتایج</label>
                </div>
            </div>
            <div id="opium-add-results" class="p-3 overflow-y-auto flex-1 min-h-0 custom-scrollbar space-y-1.5"></div>
            <div class="shrink-0 bg-slate-100 px-6 py-3 flex justify-between items-center border-t border-slate-200">
                <span class="text-[11px] font-bold text-slate-600">انتخاب‌شده: <span id="opium-add-count" class="text-teal-700">۰</span> نفر</span>
                <div class="flex gap-2">
                    <button onclick="closeOpiumAddModal()" class="px-4 py-2 border rounded-xl hover:bg-white text-xs font-bold">انصراف</button>
                    <button onclick="confirmOpiumAdd()" class="px-5 py-2 bg-teal-brand hover:bg-teal-700 text-white text-xs font-bold rounded-xl shadow transition">افزودن انتخاب‌شده‌ها</button>
                </div>
            </div>
        </div>
    </div>
