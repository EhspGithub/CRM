    <!-- Quick Status Deactivation Modal (Popup) -->
    <div id="deactivate-modal" class="hidden fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50 animate-fade-in no-print">
        <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full overflow-hidden border border-slate-100">
            <div class="bg-rose-600 p-5 text-white flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-user-slash text-lg"></i>
                    <h3 class="text-sm font-bold">غیرفعال‌سازی پرونده مراجع</h3>
                </div>
                <button onclick="closeDeactivateModal()" class="text-white/80 hover:text-white">
                    <i class="fa-solid fa-circle-xmark text-lg"></i>
                </button>
            </div>
            <form id="deactivate-form" onsubmit="handleDeactivateSubmit(event)" class="p-6 space-y-4 text-xs">
                <input type="hidden" id="deactivate-patient-id">
                <div>
                    <label class="block font-bold text-slate-700 mb-2">نام و مشخصات بیمار:</label>
                    <div id="deactivate-patient-details" class="p-3 bg-slate-50 border rounded-xl font-bold">---</div>
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-2">علت غیرفعال شدن پرونده <span class="text-red-500">*</span></label>
                    <select id="deactivate-reason" required class="w-full px-4 py-2.5 border border-gray-300 rounded-xl outline-none focus:border-teal-brand">
                        <option value="" disabled selected>لطفاً علت را انتخاب کنید</option>
                        <option value="بهبودی کامل (ترخیص)">بهبودی کامل (ترخیص)</option>
                        <option value="انصراف از درمان">انصراف از درمان</option>
                        <option value="انتقال به مرکز دیگر">انتقال به مرکز دیگر</option>
                        <option value="فوت">فوت</option>
                        <option value="عدم مراجعه طولانی مدت">عدم مراجعه طولانی مدت</option>
                        <option value="مشکلات مالی">مشکلات مالی</option>
                        <option value="علت نامشخص">علت نامشخص</option>
                        <option value="سایر">سایر</option>
                    </select>
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-2">توضیحات بیشتر (اختیاری):</label>
                    <textarea id="deactivate-notes" rows="3" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl outline-none focus:border-teal-brand" placeholder="توضیحات تکمیلی پیرامون قطع درمان..."></textarea>
                </div>
                <div class="pt-4 border-t flex justify-end gap-2">
                    <button type="button" onclick="closeDeactivateModal()" class="px-4 py-2 border rounded-xl hover:bg-slate-50">انصراف</button>
                    <button type="submit" id="deactivate-submit-btn" class="px-5 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl font-bold transition disabled:opacity-50 disabled:cursor-not-allowed">ذخیره و غیرفعال‌سازی</button>
                </div>
            </form>
        </div>
    </div>
