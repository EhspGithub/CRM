    <!-- Opium report: print column picker -->
    <div id="opium-print-cols-modal" class="hidden fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50 no-print">
        <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full overflow-hidden border border-slate-100 animate-fade-in">
            <div class="bg-slate-700 p-5 text-white flex justify-between items-center">
                <div class="flex items-center gap-2"><i class="fa-solid fa-print text-lg"></i><h3 class="text-sm font-bold">انتخاب ستون‌های چاپ</h3></div>
                <button type="button" onclick="closeOpiumPrintColsModal()" class="text-white/80 hover:text-white"><i class="fa-solid fa-circle-xmark text-lg"></i></button>
            </div>
            <div class="p-5 space-y-3 text-xs">
                <p class="text-[11px] font-bold text-slate-500">فقط ستون‌های تیک‌خورده در نسخه چاپی می‌آیند. این انتخاب روی جدول اصلی گزارش اثری ندارد.</p>
                <div class="flex items-center gap-2">
                    <button type="button" onclick="opPrintColsSetAll(true)" class="px-3 py-1.5 border rounded-lg text-[11px] font-bold text-slate-600 hover:bg-slate-50 transition">انتخاب همه</button>
                    <button type="button" onclick="opPrintColsSetAll(false)" class="px-3 py-1.5 border rounded-lg text-[11px] font-bold text-slate-600 hover:bg-slate-50 transition">لغو انتخاب همه</button>
                </div>
                <div id="opium-print-cols-list" class="border border-gray-200 rounded-2xl divide-y divide-gray-100 max-h-[50vh] overflow-y-auto custom-scrollbar"></div>
            </div>
            <div class="p-5 border-t bg-slate-50 flex justify-end gap-2">
                <button type="button" onclick="closeOpiumPrintColsModal()" class="px-4 py-2 border rounded-xl hover:bg-white text-xs font-bold transition">انصراف</button>
                <button type="button" onclick="confirmOpiumPrintCols()" class="px-5 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-xs font-bold shadow-md transition flex items-center gap-1.5"><i class="fa-solid fa-print"></i> تأیید و چاپ</button>
            </div>
        </div>
    </div>
