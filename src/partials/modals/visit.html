    <!-- Clinical Visit Registration Modal -->
    <div id="visit-modal" class="hidden fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50 no-print">
        <div class="bg-white rounded-3xl shadow-2xl max-w-2xl w-full overflow-hidden border border-slate-100 max-h-[92vh] flex flex-col animate-fade-in">
            <div class="bg-emerald-600 p-5 text-white flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-notes-medical text-lg"></i>
                    <h3 class="text-sm font-bold" id="visit-modal-header-title">ثبت ویزیت بالینی جدید (Clinical CRM)</h3>
                </div>
                <button onclick="closeVisitModal()" class="text-white/80 hover:text-white">
                    <i class="fa-solid fa-circle-xmark text-lg"></i>
                </button>
            </div>
            
            <!-- Patient Mini Summary -->
            <div class="bg-slate-50 border-b p-4 grid grid-cols-2 sm:grid-cols-4 gap-4 text-xs font-bold text-slate-700">
                <div>کد پرونده: <span id="v-m-code" class="text-teal-brand">---</span></div>
                <div>بیمار: <span id="v-m-name" class="text-slate-800">---</span></div>
                <div>ماده مصرفی: <span id="v-m-substance" class="text-amber-600">---</span></div>
                <div>درمان فعلی: <span id="v-m-drug" class="text-indigo-600">---</span></div>
            </div>

            <form onsubmit="handleVisitSubmit(event)" class="p-6 overflow-y-auto flex-1 custom-scrollbar space-y-4 text-xs">
                <input type="hidden" id="visit-patient-id">
                <input type="hidden" id="visit-edit-id">
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block font-bold text-slate-700 mb-2">تاریخ ویزیت (شمسی) <span class="text-red-500">*</span></label>
                        <input type="text" id="visit-date" data-jdp required class="w-full px-4 py-2 border border-gray-300 rounded-xl outline-none text-center focus:border-teal-brand">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-2">پزشک ویزیت‌کننده <span class="text-red-500">*</span></label>
                        <select id="visit-doctor" required class="w-full px-4 py-2 border border-gray-300 rounded-xl outline-none focus:border-teal-brand">
                            <!-- filled dynamically -->
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-2">وضعیت مراجعه بالینی <span class="text-red-500">*</span></label>
                        <select id="visit-status" required class="w-full px-4 py-2 border border-gray-300 rounded-xl outline-none focus:border-teal-brand">
                            <option value="ادامه درمان">ادامه درمان (پایداری دوز)</option>
                            <option value="کاهش دوز">کاهش دوز</option>
                            <option value="افزایش دوز">افزایش دوز</option>
                            <option value="تغییر دارو">تغییر دارو</option>
                            <option value="ارجاع">ارجاع به پزشک متخصص خارج مرکز</option>
                            <option value="ترخیص">ترخیص با بهبودی کامل</option>
                            <option value="قطع درمان">قطع درمان (انصراف)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-2">تغییر نوع دارو (روال درمان فعلی)</label>
                        <select id="visit-drug" onchange="handleVisitDrugChange()" class="w-full px-4 py-2 border border-gray-300 rounded-xl outline-none focus:border-teal-brand">
                            <option value="بدون تغییر">بدون تغییر در پروتکل فعلی</option>
                            <option value="روان درمانی">روان درمانی</option>
                            <option value="ش متادون">ش متادون</option>
                            <option value="ق متادون">ق متادون</option>
                            <option value="بوپرنورفین">بوپرنورفین</option>
                            <option value="اپیوم">اپیوم</option>
                            <option value="متقاضی اپیوم">متقاضی اپیوم</option>
                        </select>
                    </div>
                    <div id="v-dosage-container" class="hidden">
                        <label class="block font-bold text-slate-700 mb-2">دوز دارویی جدید <span class="text-red-500">*</span></label>
                        <div class="relative rounded-xl shadow-sm">
                            <input type="number" id="visit-dosage" step="0.1" class="w-full px-4 py-2 border border-gray-300 rounded-xl outline-none">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <span id="v-dosage-unit" class="text-xs text-gray-500">واحد</span>
                            </div>
                        </div>
                    </div>
                    <!-- NEW: Opium priority field — shown only when the resulting drug is اپیوم, so priority can be changed during a visit -->
                    <div id="v-priority-container" class="hidden">
                        <label class="block font-bold text-slate-700 mb-2">اولویت اپیوم</label>
                        <select id="visit-priority" class="w-full px-4 py-2 border border-gray-300 rounded-xl outline-none focus:border-teal-brand">
                            <option value="">انتخاب کنید</option>
                            <option value="A1">A1</option>
                            <option value="A2">A2</option>
                            <option value="B1">B1</option>
                            <option value="B2">B2</option>
                            <option value="B3">B3</option>
                        </select>
                    </div>
                </div>

                <!-- NEW: Lab & Addiction Test Section -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 p-3.5 bg-slate-50 border border-slate-200 rounded-xl items-center">
                    <div class="flex items-center space-x-2 space-x-reverse h-full">
                        <input type="checkbox" id="visit-lab-request" class="w-4 h-4 text-teal-brand rounded border-gray-300 focus:ring-teal-brand cursor-pointer">
                        <label for="visit-lab-request" class="font-bold text-slate-700 cursor-pointer">درخواست آزمایشات بالینی</label>
                    </div>
                    <div class="flex items-center space-x-2 space-x-reverse h-full">
                        <input type="checkbox" id="visit-addiction-test" class="w-4 h-4 text-teal-brand rounded border-gray-300 focus:ring-teal-brand cursor-pointer">
                        <label for="visit-addiction-test" class="font-bold text-slate-700 cursor-pointer">درخواست تست اعتیاد (UDS)</label>
                    </div>
                    <div>
                        <label class="block font-bold text-slate-600 mb-1.5 text-[10px]">نتیجه تست اعتیاد (در صورت ثبت)</label>
                        <select id="visit-test-result" class="w-full px-3 py-1.5 border border-gray-300 rounded-lg outline-none focus:border-teal-brand text-xs font-bold">
                            <option value="">نامشخص / ثبت نشده</option>
                            <option value="مثبت" class="text-rose-600 font-bold">مثبت (+)</option>
                            <option value="منفی" class="text-emerald-600 font-bold">منفی (-)</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block font-bold text-slate-700 mb-2">یادداشت بالینی و گزارشات بیمار (مشکلات، خواب، عوارض):</label>
                    <textarea id="visit-notes" required rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-xl outline-none focus:border-teal-brand" placeholder="توضیحاتی از قبیل علائم جسمی، خواب بیمار..."></textarea>
                </div>

                <div class="pt-4 border-t flex justify-end gap-2">
                    <button type="button" onclick="closeVisitModal()" class="px-4 py-2 border rounded-xl hover:bg-slate-50">انصراف</button>
                    <button type="submit" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold shadow">ذخیره ویزیت بالینی</button>
                </div>
            </form>
        </div>
    </div>
