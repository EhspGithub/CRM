    <!-- Random Sample Selection Modal (گزارش بررسی پرونده‌ها) -->
    <div id="random-sample-modal" class="hidden fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-[55] animate-fade-in no-print">
        <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full overflow-hidden border border-slate-100">
            <div class="bg-slate-700 p-5 text-white flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-dice text-lg"></i>
                    <h3 class="text-sm font-bold">انتخاب تصادفی پرونده‌ها</h3>
                </div>
                <button type="button" onclick="closeRandomSampleModal()" class="text-white/80 hover:text-white">
                    <i class="fa-solid fa-circle-xmark text-lg"></i>
                </button>
            </div>
            <div class="p-5 text-xs space-y-4">
                <div class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 font-bold text-slate-600 flex justify-between items-center">
                    <span id="random-sample-pool-label">تعداد پرونده‌های فعال:</span>
                    <span id="random-sample-pool-count" class="font-yekan text-sm text-teal-700">۰</span>
                </div>
                <div>
                    <label class="block font-bold text-slate-600 mb-1.5">تعداد پرونده‌های موردنظر برای انتخاب تصادفی</label>
                    <input type="number" id="random-sample-count" min="1" step="1" placeholder="مثلاً ۲۰" class="no-spin w-full px-3 py-2 bg-white border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-teal-brand/30 text-center font-yekan font-bold" onkeydown="if(event.key==='Enter'){event.preventDefault();runRandomSample();}" oninput="clearRandomSampleError()">
                    <p id="random-sample-error" class="hidden mt-1.5 text-[11px] font-bold text-rose-600"></p>
                </div>
                <label class="flex items-center space-x-2 space-x-reverse cursor-pointer bg-slate-50 px-3 py-2 rounded-xl border hover:bg-slate-100 font-bold text-slate-700">
                    <input type="checkbox" id="random-sample-include-inactive" onchange="updateRandomSamplePool()" class="rounded text-teal-brand w-4 h-4"> <span>آیا از پرونده‌های غیرفعال هم می‌خواهید انتخاب کنید؟</span>
                </label>
            </div>
            <div class="p-5 border-t bg-slate-50 flex justify-end gap-2">
                <button type="button" onclick="closeRandomSampleModal()" class="px-4 py-2 border rounded-xl hover:bg-white text-xs font-bold transition">انصراف</button>
                <button type="button" onclick="runRandomSample()" class="px-5 py-2 bg-teal-brand hover-bg-teal-700 text-white rounded-xl text-xs font-bold shadow-md transition flex items-center gap-1.5">
                    <i class="fa-solid fa-dice"></i> انتخاب تصادفی
                </button>
            </div>
        </div>
    </div>
