    <!-- NEW: PREMIUM CUSTOM NOTIFICATION MODAL SYSTEM (REPLACES WINDOW.ALERT AND WINDOW.CONFIRM) -->
    <!-- Custom Alert Modal -->
    <div id="custom-alert-modal" class="hidden fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-[100] animate-fade-in no-print">
        <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full overflow-hidden border border-slate-100 p-6 space-y-4">
            <div class="flex items-center gap-3 text-amber-500">
                <i class="fa-solid fa-circle-exclamation text-2xl animate-bounce"></i>
                <h3 class="text-sm font-extrabold text-slate-800" id="custom-alert-title">هشدار</h3>
            </div>
            <p class="text-xs text-slate-600 leading-relaxed font-semibold" id="custom-alert-message">پیام سیستم</p>
            <div class="flex justify-end pt-2">
                <button onclick="closeCustomAlert()" class="px-5 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-xs font-bold transition shadow">باشه</button>
            </div>
        </div>
    </div>

    <!-- Custom Confirm Modal -->
    <div id="custom-confirm-modal" class="hidden fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-[100] animate-fade-in text-slate-800 font-semibold leading-relaxed">
        <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full overflow-hidden border border-slate-100 p-6 space-y-4">
            <div class="flex items-center gap-3 text-rose-500">
                <i class="fa-solid fa-triangle-exclamation text-2xl animate-pulse"></i>
                <h3 class="text-sm font-extrabold text-slate-800" id="custom-confirm-title">تایید عملیات</h3>
            </div>
            <p class="text-xs text-slate-600 leading-relaxed font-semibold" id="custom-confirm-message">آیا از انجام این کار مطمئن هستید؟</p>
            <div class="flex justify-end gap-2 pt-2 font-sans">
                <button id="custom-confirm-cancel-btn" onclick="closeCustomConfirm(false)" class="px-4 py-2 border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-xl text-xs font-bold transition">انصراف</button>
                <button id="custom-confirm-ok-btn" onclick="closeCustomConfirm(true)" class="px-5 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold transition shadow">بله، تایید می‌کنم</button>
            </div>
        </div>
    </div>
