    <!-- Top Header -->
    <header class="app-header bg-dark-sidebar text-white px-3 py-2 md:px-6 md:py-4 flex justify-between items-center gap-2 border-b border-gray-800 shadow-md no-print">
        <div class="flex items-center gap-2 md:gap-0 md:space-x-4 md:space-x-reverse min-w-0">
            <div class="p-2 md:p-2.5 bg-teal-brand rounded-xl shrink-0">
                <i class="fa-solid fa-hands-holding-child text-lg md:text-2xl"></i>
            </div>
            <div class="min-w-0">
                <h1 id="header-title" class="text-sm md:text-xl font-bold truncate">سامانه مدیریت کلینیک ترک اعتیاد «نسیم رهایی»</h1>
                <div class="flex items-center space-x-3 space-x-reverse text-[10px] md:text-xs text-slate-400 mt-0.5 md:mt-1">
                    <span id="header-sub" class="hidden md:inline">طراحی و توسعه : دکتر حسن پور | نسخه هوشمند CRM لوکال و آفلاین</span>
                    <span class="text-slate-600 hidden md:inline">|</span>
                    <span id="header-version" class="text-slate-300 font-bold">ورژن ۹۳</span>
                    <span class="text-slate-600">|</span>
                    <span id="header-shamsi-date" class="text-teal-400 font-bold">---</span>
                </div>
            </div>
        </div>
        
        <div class="flex items-center space-x-6 space-x-reverse shrink-0">
            <!-- اضافه شدن دکمه‌های دیتابیس به هدر -->
            <div class="flex items-center space-x-2 space-x-reverse">
                <div class="flex items-center space-x-2 space-x-reverse text-xs bg-slate-800 px-3 py-2 rounded-lg border border-slate-700 hidden md:flex">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span class="text-gray-300 font-medium">پایگاه داده: متصل</span>
                </div>
                
                <div class="flex items-center space-x-1 space-x-reverse bg-slate-800 p-1 rounded-lg border border-slate-700">
                    <button id="btn-export-backup" onclick="exportDatabase()" class="w-8 h-8 flex items-center justify-center text-teal-400 hover:bg-slate-700 rounded transition duration-200" title="پشتیبان‌گیری دیتابیس (دانلود فایل)">
                        <i class="fa-solid fa-download"></i>
                    </button>
                    <button id="btn-change-backup-folder" onclick="changeBackupFolder()" class="hidden md:flex w-8 h-8 items-center justify-center text-amber-400 hover:bg-slate-700 rounded transition duration-200" title="تغییر پوشه پیش‌فرض ذخیره بکاپ">
                        <i class="fa-solid fa-folder-open"></i>
                    </button>
                    <label class="w-8 h-8 flex items-center justify-center text-indigo-400 hover:bg-slate-700 rounded transition duration-200 cursor-pointer mb-0" title="بازیابی دیتابیس (بارگذاری)">
                        <input type="file" id="import-db-file" accept=".json" onchange="handleBackupFileSelected(event)" class="hidden">
                        <i class="fa-solid fa-upload"></i>
                    </label>
                    <button onclick="clearAllData()" class="hidden md:flex w-8 h-8 items-center justify-center text-rose-400 hover:bg-slate-700 rounded transition duration-200" title="پاکسازی کل اطلاعات">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            </div>

            <!-- تغییر بخش نمایش اطلاعات کادر مدیریتی در هدر -->
            <div class="hidden lg:flex items-center space-x-4 space-x-reverse border-r border-slate-700 pr-4">
                <div class="text-left hidden sm:flex flex-col space-y-1">
                    <div class="flex items-center justify-end gap-2 text-xs">
                        <span id="header-manager-name" class="font-bold text-teal-300">---</span>
                        <span class="text-[10px] text-gray-400 font-medium">مؤسس و مدیر</span>
                        <i class="fa-solid fa-user-tie text-[10px] text-teal-400/70"></i>
                    </div>
                    <div class="flex items-center justify-end gap-2 text-xs">
                        <span id="header-doctor-name" class="font-bold text-indigo-300">---</span>
                        <span class="text-[10px] text-gray-400 font-medium">پزشک ارشد</span>
                        <i class="fa-solid fa-user-doctor text-[10px] text-indigo-400/70"></i>
                    </div>
                </div>
            </div>
        </div>
    </header>
