[package]
name = "nasim-db"
version = "1.0.0"
edition = "2021"
description = "SQLite access for Nasim Rahayi: one connection, JSON params/rows, atomic batches."
publish = false

[dependencies]
# "bundled" compiles SQLite from source, so Windows and Android need no system SQLite.
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
